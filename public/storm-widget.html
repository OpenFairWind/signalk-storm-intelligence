<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:8px;background:transparent;color:CanvasText}.box{height:100%;box-sizing:border-box;border-radius:8px;padding:7px 9px;background:color-mix(in srgb,Canvas 88%,transparent);border:1px solid color-mix(in srgb,CanvasText 15%,transparent)}.top{display:flex;justify-content:space-between;font-weight:700}.small{font-size:.78em;opacity:.75}.warn{color:#d28a00}.alarm{color:#d22}.normal{color:#16883f}</style></head><body><div class="box"><div class="top"><span>Storm Intelligence</span><span id="state">—</span></div><div id="info" class="small">loading…</div></div><script src="/plotterext/signalk-storm-intelligence/plotter-bus.js"></script><script>
const bus=new SignalKPlotterBus();
async function status(){try{await bus.connect();if(bus.has('resources')){const r=await bus.call('resources.list',{type:'stormIntelligence'});if(r?.status)return r.status}}catch{}const x=await fetch('/plugins/signalk-storm-intelligence/status');if(!x.ok)throw new Error('status unavailable');return x.json()}
async function load(){try{const s=await status(),c=s.storm?.cells?.[0];state.textContent=(s.storm?.state||'normal').toUpperCase();state.className=s.storm?.state||'normal';info.textContent=c?`${(c.distanceMeters/1852).toFixed(1)} NM · CPA ${(c.cpa?.dcpaMeters/1852).toFixed(1)} NM · ${Math.round((c.cpa?.tcpaSec||0)/60)} min`:'No approaching cell'}catch(e){info.textContent='Unavailable'}}load();setInterval(load,15000)
</script></body></html>
